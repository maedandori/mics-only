[package]
name = "mics-only-settings"
version = "0.2.65"
edition = "2021"
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
winreg = "0.55"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
[build-dependencies]
tauri-build = "2"
ico = "0.4"
[profile.release]
opt-level = "s"
lto = true
strip = true

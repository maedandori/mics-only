<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071020">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<title>MICS Local Dashboard</title>
</head>
<body>
<main>
  <header class="topbar">
    <div class="brand">
      <div class="eyebrow">MICS ONLY · LOCAL</div>
      <h1>機械稼働状況</h1>
    </div>
    <section class="summary" aria-label="Machine overview">
      <div class="stat"><span>機械</span><strong id="total">14</strong></div>
      <div class="stat"><span>稼働中</span><strong id="running">0</strong></div>
      <div class="stat"><span>停止 / 異常</span><strong id="stopped">0</strong></div>
      <div class="stat"><span>通信</span><strong id="connection">確認中</strong></div>
      <div class="stat server"><strong id="server-mode">STANDBY</strong><span id="updated">保存データなし</span></div>
    </section>
  </header>
  <section class="machines" id="machines" aria-label="Machines"></section>
  <footer>Local-only · 127.0.0.1 · Internet不要</footer>
</main>
<script src="/app.js" defer></script>
</body>
</html>

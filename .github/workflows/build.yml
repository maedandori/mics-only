name: Build and package MICS Only
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust
        run: cargo test
      - name: Compile Windows EXE
        run: cargo build --release
      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: MICS-Only-Portable-Windows
          path: |
            target/release/mics-only.exe
            target/release/mics-only-settings.exe
            mics.ini.example
            README.md
            www/**
          if-no-files-found: error
      - name: Install Inno Setup
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package installer
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\mics-only.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create portable ZIP with WWW assets
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-package | Out-Null
          Copy-Item target/release/mics-only.exe release-package/
          Copy-Item target/release/mics-only-settings.exe release-package/
          Copy-Item mics.ini.example release-package/
          Copy-Item README.md release-package/
          Copy-Item www -Destination release-package/www -Recurse
          Compress-Archive -Path release-package/* -DestinationPath dist/MICS-Only-Portable-Windows.zip -Force
      - name: Publish GitHub Release v0.2.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: MICS Only v0.2.0
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/MICS-Only-Setup.exe
            dist/MICS-Only-Portable-Windows.zip
      - name: Upload Windows installer
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MICS-Only-Windows-Installer
          path: dist/MICS-Only-Setup.exe
          if-no-files-found: error

name: Build and release MICS Only portable
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust
        run: cargo test
      - name: Compile Windows EXEs
        run: cargo build --release
      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-package | Out-Null
          Copy-Item target/release/mics-only.exe release-package/
          Copy-Item target/release/mics-only-settings.exe release-package/
          Copy-Item mics.ini.example release-package/
          Copy-Item README.md release-package/
          Copy-Item www -Destination release-package/www -Recurse
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path release-package/* -DestinationPath dist/MICS-Only-Portable-Windows.zip -Force
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MICS-Only-Portable-Windows
          path: dist/MICS-Only-Portable-Windows.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.4
          name: MICS Only v0.2.4
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/MICS-Only-Portable-Windows.zip

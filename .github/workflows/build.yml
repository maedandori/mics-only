name: Build and release MICS Only portable
# One final build on the release commit. Concurrency prevents overlapping
# Windows builds; superseded runs are cancelled.
on:
  # Web-only changes have their own Chromium and packaging workflow.
  # package.json remains shared with the Core version contract.
  push:
    branches: [main]
    paths:
      - '**'
      - '!local-vue/**'
      - 'local-vue/package.json'
      - '!.github/workflows/web-release.yml'
      - '!.github/workflows/build.yml'
      - '!AGENTS.md'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!local-vue/**'
      - 'local-vue/package.json'
      - '!.github/workflows/web-release.yml'
      - '!AGENTS.md'
  workflow_dispatch:
concurrency:
  group: mics-only-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Rust, frontend, and release versions match
        id: version
        shell: pwsh
        run: |
          $cargo = Get-Content Cargo.toml -Raw
          $match = [regex]::Match($cargo, '(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"')
          if (!$match.Success) { throw 'Cargo.toml version not found' }
          $version = $match.Groups[1].Value
          $frontend = (Get-Content local-vue/package.json -Raw | ConvertFrom-Json).version
          if ($frontend -ne $version) { throw "Version mismatch: Cargo=$version, frontend=$frontend" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
      - name: Preflight material calculation and data-source contract
        run: node --test local-vue/tests/material-preflight.test.mjs
      - name: Build original HTML/CSS/JavaScript template (no Vue)
        working-directory: local-vue
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Verify original vanilla JS template files
        shell: pwsh
        run: |
          if (!(Test-Path www/vue-v${{ steps.version.outputs.version }}/index.html)) { throw 'Vue index missing' }
          foreach ($page in @('change-schedule.html','status-colors.html','change-aliases.html')) {
            if (!(Test-Path (Join-Path 'www/vue-v${{ steps.version.outputs.version }}' $page))) { throw "Original template page missing: $page" }
          }
          foreach ($file in @('change-aliases.json','status-colors.json')) {
            if (!(Test-Path (Join-Path 'www/vue-v${{ steps.version.outputs.version }}/data' $file))) { throw "Settings JSON missing: $file" }
          }
          if (!(Get-ChildItem www/vue-v${{ steps.version.outputs.version }}/assets -Filter '*.js')) { throw 'Vue JS asset missing' }
          if (!(Get-ChildItem www/vue-v${{ steps.version.outputs.version }}/assets -Filter '*.css')) { throw 'Template CSS asset missing' }
          if (!(Test-Path www/vue-v${{ steps.version.outputs.version }}/js/vanilla-runtime.js)) { throw 'Native JS runtime missing' }
          $layoutCss = 'www/vue-v${{ steps.version.outputs.version }}/css/tailwind-generated.css'
          if (!(Test-Path $layoutCss) -or (Get-Item $layoutCss).Length -lt 4000) { throw 'Machine grid CSS missing from current release' }
          if (!(Test-Path www/vue-v${{ steps.version.outputs.version }}/assets/compiled-expressions.js)) { throw 'Precompiled template expressions missing' }
          $schedule=Get-Content www/vue-v${{ steps.version.outputs.version }}/js/change-schedule-app.js -Raw
          if ($schedule -notmatch 'if \(!item\.types\.length\) continue') { throw 'Original event-only schedule filtering is missing' }
          if ($schedule -match 'if \(!item\.types\.length && !drying\) continue') { throw 'Drying-only non-event rows were reintroduced' }
          if ($schedule -notmatch 'isDryingChange\(r,item\.types,state\.aliasCfg\)') { throw 'Drying tag is not gated by mold/color events' }
          $common=Get-Content www/vue-v${{ steps.version.outputs.version }}/js/common.js -Raw
          if (!$common.Contains("types.push('刻印確認')")) { throw 'Stamp confirmation is missing' }
          if (!$common.Contains("if (nextStamp) types.push('刻印確認');")) { throw 'Wrong stamp confirmation: must check the NEXT product only' }
          if ($common.Contains("if (prevStamp || nextStamp) types.push('刻印確認');")) { throw 'Stamp inherited from previous mold again' }
          if (!$common.Contains('isDryingChange')) { throw 'Drying transition helper is missing' }
          $aliasPage=Get-Content www/vue-v${{ steps.version.outputs.version }}/js/change-aliases-app.js -Raw
          if (!$aliasPage.Contains("id: 'animation'")) { throw 'Status animation tab is absent' }
          if (!$aliasPage.Contains('const animationReadOnly = true')) { throw 'Local animation editing must stay read-only' }
          $aliasCommon=Get-Content www/vue-v${{ steps.version.outputs.version }}/js/common.js -Raw
          if (!$aliasCommon.Contains('machineAnimationEffect')) { throw 'Local alias JSON animation matching absent' }
          $dashboard=Get-Content www/vue-v${{ steps.version.outputs.version }}/js/dashboard-app.js -Raw
          if (!$dashboard.Contains('mics-node-anim-blink')) { throw 'Full-node status animation is absent' }
          if ($dashboard.Contains('extractDryingMold(m,state.aliasCfg)')) { throw 'Drying tag still permanently shown on each mold' }
          if (!$dashboard.Contains("new EventSource('/api/live')")) { throw 'Dashboard live JSON stream missing' }
          if (!$dashboard.Contains("fetch('/api/json-versions'")) { throw 'Local JSON version watchdog missing from dashboard' }
          if (!$schedule.Contains("fetch('/api/json-versions'")) { throw 'Local JSON version watchdog missing from schedule' }
          if (!$dashboard.Contains('queueMicrotask(()=>void load())')) { throw 'Busy dashboard must replay missed updates' }
          if (!$schedule.Contains("new EventSource('/api/live')")) { throw 'Schedule live JSON stream missing' }
          if (!$schedule.Contains('displayTypes: changeEventTags(r,item.types,state.aliasCfg)')) { throw '乾燥 and 刻印 tags missing from schedule 区分' }
          if (!$dashboard.Contains('changeEventTags(metricsByMachine[m.machine_no].change.row,metricsByMachine[m.machine_no].change.types,state.aliasCfg)')) { throw 'Machine node change tags missing' }
          if (!$schedule.Contains('ev.displayTypes')) { throw 'Schedule table is not using unified event tags' }
          if (!$dashboard.Contains('refreshLocalSchedule')) { throw 'Dashboard must refresh changed schedule JSON' }
          if (!$dashboard.Contains('mics-next-compact') -or !$dashboard.Contains('次の金型')) { throw 'Machine node missing compact next-change panel' }
          if (!$dashboard.Contains('品番替え')) { throw 'Local product-only change detection absent' }
          if (!$dashboard.Contains('refreshLocalSchedule(true)')) { throw 'SSE schedule update still throttled' }
          $compiled=Get-Content www/vue-v${{ steps.version.outputs.version }}/js/dashboard-app.js -Raw
          if ($compiled.Contains("from 'vue'")) { throw 'Vue runtime reference remained' }
      - name: Test local next-change detection (JSON only)
        run: node --test local-vue/tests/next-change.test.mjs
      - name: Test local JSON SSE and refresh watchdog wiring
        run: node --test local-vue/tests/json-live-watchdog.test.mjs
      - name: Test offline 7-day change schedule wiring
        run: node --test local-vue/tests/weekly-7day-offline.test.mjs
      - name: Test Japanese interface labels
        run: node --test local-vue/tests/japanese-ui.test.mjs
      - name: Test Rust
        run: cargo test
      - name: Compile Windows EXEs
        run: cargo build --release
      - name: Verify Windows launcher recovery and child lifetime
        shell: pwsh
        run: ./scripts/test-launcher.ps1
      - name: Test and build Japanese Tauri Settings
        shell: pwsh
        run: |
          $settingsVersion=(Select-String -Path settings-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $uiVersion=(Get-Content settings-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if($settingsVersion -ne '${{ steps.version.outputs.version }}' -or $uiVersion -ne $settingsVersion){throw 'Settings version mismatch'}
          node --check settings-tauri/ui/app.js
          if($LASTEXITCODE -ne 0){throw 'Tauri frontend syntax failed'}
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path settings-tauri/src/process.ps1),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){throw ($errors|Out-String)}
          cargo test --manifest-path settings-tauri/Cargo.toml
          if($LASTEXITCODE -ne 0){throw 'Tauri tests failed'}
          cargo build --release --manifest-path settings-tauri/Cargo.toml
          if($LASTEXITCODE -ne 0){throw 'Tauri build failed'}
      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-package | Out-Null
          Copy-Item target/release/mics-only.exe release-package/
          Copy-Item target/release/mics-core.exe release-package/mics-core-a.exe
          Copy-Item settings-tauri/target/release/mics-only-settings.exe release-package/
          Copy-Item mics.ini.example release-package/
          Copy-Item README.md release-package/
          Copy-Item www -Destination release-package/www -Recurse
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path release-package/* -DestinationPath dist/MICS-Only-Launcher-Windows.zip -Force
          New-Item -ItemType Directory -Force -Path core-package/www | Out-Null
          Copy-Item target/release/mics-core.exe core-package/
          Copy-Item "www/vue-v${{ steps.version.outputs.version }}" core-package/www/ -Recurse
          Compress-Archive -Path core-package/* -DestinationPath dist/MICS-Core-Windows.zip -Force
          if (!(Test-Path release-package/mics-core-a.exe)) { throw 'Missing initial Core A' }
          if (!(Test-Path core-package/mics-core.exe)) { throw 'Missing standalone Core' }
      - name: Validate updater script syntax
        shell: pwsh
        run: |
          $tokens=$null
          $parseErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/apply-update.ps1),[ref]$tokens,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "Updater syntax errors: $($parseErrors | Out-String)" }
          $updaterText=Get-Content scripts/apply-update.ps1 -Raw
          foreach ($required in @('UPDATE_PREFLIGHT_OK','UPDATE_RECOVERY_RESTARTED','migration-presence.json')) {
            if (!$updaterText.Contains($required)) { throw "Missing bridge safety contract: $required" }
          }

      - name: Upload optional portable artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MICS-Only-Launcher-and-Core
          path: |
            dist/MICS-Only-Launcher-Windows.zip
            dist/MICS-Core-Windows.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: MICS Only mo${{ steps.version.outputs.version }} / Launcher ml1.0.1
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/MICS-Only-Launcher-Windows.zip
            dist/MICS-Core-Windows.zip

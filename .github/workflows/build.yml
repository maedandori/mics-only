name: Build and release MICS Only portable
# One final build on the release commit. Concurrency prevents overlapping
# Windows builds; superseded runs are cancelled.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: mics-only-windows-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build original HTML/CSS/JavaScript template (no Vue)
        working-directory: local-vue
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Verify original vanilla JS template files
        shell: pwsh
        run: |
          if (!(Test-Path www/vue-v0.2.37/index.html)) { throw 'Vue index missing' }
          foreach ($page in @('change-schedule.html','status-colors.html','change-aliases.html')) {
            if (!(Test-Path (Join-Path 'www/vue-v0.2.37' $page))) { throw "Original template page missing: $page" }
          }
          foreach ($file in @('change-aliases.json','status-colors.json')) {
            if (!(Test-Path (Join-Path 'www/vue-v0.2.37/data' $file))) { throw "Settings JSON missing: $file" }
          }
          if (!(Get-ChildItem www/vue-v0.2.37/assets -Filter '*.js')) { throw 'Vue JS asset missing' }
          if (!(Get-ChildItem www/vue-v0.2.37/assets -Filter '*.css')) { throw 'Template CSS asset missing' }
          if (!(Test-Path www/vue-v0.2.37/js/vanilla-runtime.js)) { throw 'Native JS runtime missing' }
          $layoutCss = 'www/vue-v0.2.37/css/tailwind-generated.css'
          if (!(Test-Path $layoutCss) -or (Get-Item $layoutCss).Length -lt 4000) { throw 'Machine grid CSS missing from current release' }
          if (!(Test-Path www/vue-v0.2.37/assets/compiled-expressions.js)) { throw 'Precompiled template expressions missing' }
          $schedule=Get-Content www/vue-v0.2.37/js/change-schedule-app.js -Raw
          if ($schedule -notmatch 'if \(!item\.types\.length\) continue') { throw 'Original event-only schedule filtering is missing' }
          if ($schedule -match 'if \(!item\.types\.length && !drying\) continue') { throw 'Drying-only non-event rows were reintroduced' }
          if ($schedule -notmatch 'isDryingChange\(r,item\.types,state\.aliasCfg\)') { throw 'Drying tag is not gated by mold/color events' }
          $common=Get-Content www/vue-v0.2.37/js/common.js -Raw
          if (!$common.Contains("types.push('刻印確認')")) { throw 'Stamp confirmation is missing' }
          if (!$common.Contains('isDryingChange')) { throw 'Drying transition helper is missing' }
          $aliasPage=Get-Content www/vue-v0.2.37/js/change-aliases-app.js -Raw
          if (!$aliasPage.Contains("id: 'animation'")) { throw 'Status animation tab is absent' }
          if (!$aliasPage.Contains('const animationReadOnly = true')) { throw 'Local animation editing must stay read-only' }
          $aliasCommon=Get-Content www/vue-v0.2.37/js/common.js -Raw
          if (!$aliasCommon.Contains('machineAnimationEffect')) { throw 'Local alias JSON animation matching absent' }
          $dashboard=Get-Content www/vue-v0.2.37/js/dashboard-app.js -Raw
          if (!$dashboard.Contains('mics-node-anim-blink')) { throw 'Full-node status animation is absent' }
          if ($dashboard.Contains('extractDryingMold(m,state.aliasCfg)')) { throw 'Drying tag still permanently shown on each mold' }
          if (!$dashboard.Contains("new EventSource('/api/live')")) { throw 'Dashboard live JSON stream missing' }
          if (!$schedule.Contains("new EventSource('/api/live')")) { throw 'Schedule live JSON stream missing' }
          if (!$schedule.Contains('displayTypes: changeEventTags(r,item.types,state.aliasCfg)')) { throw '乾燥 and 刻印 tags missing from schedule 区分' }
          if (!$dashboard.Contains('changeEventTags(metricsByMachine[m.machine_no].change.row,metricsByMachine[m.machine_no].change.types,state.aliasCfg)')) { throw 'Machine node change tags missing' }
          if (!$schedule.Contains('ev.displayTypes')) { throw 'Schedule table is not using unified event tags' }
          if (!$dashboard.Contains('refreshLocalSchedule')) { throw 'Dashboard must refresh changed schedule JSON' }
          $compiled=Get-Content www/vue-v0.2.37/js/dashboard-app.js -Raw
          if ($compiled.Contains("from 'vue'")) { throw 'Vue runtime reference remained' }
      - name: Test Rust
        run: cargo test
      - name: Compile Windows EXEs
        run: cargo build --release
      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-package | Out-Null
          Copy-Item target/release/mics-only.exe release-package/
          Copy-Item target/release/mics-only-settings.exe release-package/
          Copy-Item mics.ini.example release-package/
          Copy-Item README.md release-package/
          Copy-Item www -Destination release-package/www -Recurse
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path release-package/* -DestinationPath dist/MICS-Only-Portable-Windows.zip -Force
      - name: Validate updater script syntax
        shell: pwsh
        run: |
          $tokens=$null
          $parseErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/apply-update.ps1),[ref]$tokens,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "Updater syntax errors: $($parseErrors | Out-String)" }
          # Ensure the installed script never restores an older EXE on failure.
          $updaterText=Get-Content scripts/apply-update.ps1 -Raw
          if ($updaterText -notmatch 'UPDATE_FAILED_NO_ROLLBACK') { throw 'No-rollback failure marker missing' }
          foreach ($forbidden in @('ROLLBACK_BEGIN','ROLLBACK_RESTORED','ROLLBACK_RESTARTED','function Restore')) {
            if ($updaterText.Contains($forbidden)) { throw "Automatic rollback code remained: $forbidden" }
          }

      - name: Smoke test actual Windows release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'mics-only-smoke'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Expand-Archive -LiteralPath dist/MICS-Only-Portable-Windows.zip -DestinationPath $folder -Force
          foreach ($name in @('mics-only.exe','mics-only-settings.exe','www/index.html','www/app.js','www/vue-v0.2.37/index.html')) {
            if (!(Test-Path -LiteralPath (Join-Path $folder $name))) { throw "ZIP missing $name" }
          }
          Copy-Item -LiteralPath (Join-Path $folder 'mics.ini.example') -Destination (Join-Path $folder 'mics.ini')
          # Seed local JSON so the real Windows browser test can verify 14 nodes.
          $dataDir=Join-Path $folder 'data'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $machines=@(15,8,19,14,5,17,13,6,10,11,18,7,12,16) | ForEach-Object {
            @{ machine_no=$_; status_code='200'; status_name='稼働中'; mold_name='TEST-MOLD'; qty_plan=100; qty_ok=35; qty_ng=0; qty_ng_shift=0; qty_ng_shift_status='mics_today'; qty_remaining=65; cycle_seconds=42; pick_qty=1; staff_name='TEST' }
          }
          @{machines=$machines; source='ci-fixture'; sampled_at='2026-11-16T07:30:00+09:00'} |
            ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $dataDir 'machines.json') -Encoding utf8
          $agent=Start-Process -FilePath (Join-Path $folder 'mics-only.exe') -WorkingDirectory $folder -PassThru
          try {
            $healthy=$false
            for($i=0;$i -lt 50;$i++){
              Start-Sleep -Milliseconds 400
              if($agent.HasExited){throw "Agent exited early, code $($agent.ExitCode)"}
              try{
                $status=Invoke-RestMethod 'http://127.0.0.1:8787/api/status' -TimeoutSec 1
                if($status.ok -eq $true -and $status.version -eq '0.2.37'){$healthy=$true;break}
              }catch{}
            }
            if(!$healthy){throw 'New Windows build failed API boot smoke test'}
            # Streaming SSE endpoint is verified independently, so headless DOM
            # rendering does not wait on an intentionally never-ending stream.
            $http=[System.Net.Http.HttpClient]::new()
            try {
              $live=$http.GetAsync('http://127.0.0.1:8787/api/live',[System.Net.Http.HttpCompletionOption]::ResponseHeadersRead).GetAwaiter().GetResult()
              try {
                if(!$live.IsSuccessStatusCode -or $live.Content.Headers.ContentType.MediaType -ne 'text/event-stream'){
                  throw 'Local live JSON streaming endpoint failed'
                }
              } finally { $live.Dispose() }
            } finally { $http.Dispose() }
            $dashboardResponse=Invoke-WebRequest 'http://127.0.0.1:8787/' -UseBasicParsing -TimeoutSec 5
            if($dashboardResponse.StatusCode -ne 200 -or $dashboardResponse.Content -notlike '*vue-v0.2.37/*'){throw 'Original template not active'}
            $legacy=Invoke-WebRequest 'http://127.0.0.1:8787/?legacy=1' -UseBasicParsing -TimeoutSec 5
            if($legacy.Content -notlike '*id="machines"*'){throw 'Legacy fallback missing'}
            $index=Get-Content (Join-Path $folder 'www/vue-v0.2.37/index.html') -Raw
            $refs=[regex]::Matches($index, '(?:src|href)="/vue-v0.2.37/(assets/[^"?]+)"')
            if($refs.Count -lt 1){throw 'No Vite assets referenced'}
            foreach($asset in $refs){
              $url='http://127.0.0.1:8787/vue-v0.2.37/'+$asset.Groups[1].Value
              $res=Invoke-WebRequest $url -UseBasicParsing -TimeoutSec 5
              if($res.StatusCode -ne 200 -or $res.RawContentLength -lt 20){throw "Bundled asset failed: $url"}
            }
            # Test actual browser DOM, not just the HTTP status of static assets.
            $chrome=@(
              'C:\Program Files\Google\Chrome\Application\chrome.exe',
              'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe',
              'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe',
              'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
            ) | Where-Object {Test-Path -LiteralPath $_} | Select-Object -First 1
            if(!$chrome){throw 'Headless Chrome/Edge unavailable for required browser rendering test'}
            $profile=Join-Path $env:RUNNER_TEMP 'mics-only-browser-profile'
            $dom=(& $chrome '--headless=new' '--disable-gpu' '--no-first-run' '--no-default-browser-check' '--disable-extensions' "--user-data-dir=$profile" '--virtual-time-budget=12000' '--dump-dom' 'http://127.0.0.1:8787/?ci-smoke=1' 2>$null | Out-String)
            if($dom -notmatch 'data-machine="15"' -or $dom -notmatch 'data-machine="19"'){
              throw "Browser rendered no real machine cards; HTML length $($dom.Length)"
            }
            if($dom -match 'id="mics-boot-warning"'){throw 'False boot warning despite real machine cards'}
            $cardCount=([regex]::Matches($dom,'data-machine="(?:15|8|19|14|5|17|13|6|10|11|18|7|12|16)"')).Count
            if($cardCount -lt 14){throw "Browser rendered $cardCount of 14 machine cards"}
            # A missing template must fall back to the classic UI, not kill agent.
            $vueIndexFile=Join-Path $folder 'www/vue-v0.2.37/index.html'
            Rename-Item -LiteralPath $vueIndexFile -NewName 'index.html.smoketest'
            try {
              $fallback=Invoke-WebRequest 'http://127.0.0.1:8787/' -UseBasicParsing -TimeoutSec 5
              if($fallback.StatusCode -ne 200 -or $fallback.Content -notlike '*id="machines"*'){throw 'Missing Vue bundle should fall back to classic UI'}
              $statusAfterFallback=Invoke-RestMethod 'http://127.0.0.1:8787/api/status' -TimeoutSec 5
              if($statusAfterFallback.ok -ne $true){throw 'Missing template affected agent API'}
            } finally {
              Rename-Item -LiteralPath (Join-Path $folder 'www/vue-v0.2.37/index.html.smoketest') -NewName 'index.html'
            }
            # Direct local JSON is valid even before the Firebird reader produces a snapshot.
            $machineJson=Invoke-RestMethod 'http://127.0.0.1:8787/data/machines.json' -TimeoutSec 5
            if($null -eq $machineJson.machines){throw 'Direct local machines JSON endpoint failed'}
            $scheduleJson=Invoke-RestMethod 'http://127.0.0.1:8787/data/schedule-local.json' -TimeoutSec 5
            if($null -eq $scheduleJson.rows){throw 'Direct local schedule JSON endpoint failed'}
            $templateLoader=Get-Content (Join-Path $folder 'www/vue-v0.2.37/js/common.js') -Raw
            if($templateLoader -notlike '*/data/machines.json*' -or $templateLoader -notlike '*/data/schedule-local.json*'){throw 'Template did not use direct local JSON'}
            $alias=Invoke-RestMethod 'http://127.0.0.1:8787/api/ui-template/aliases' -TimeoutSec 5
            if($null -eq $alias.color -or $null -eq $alias.mold -or $null -eq $alias.stamp){throw 'Invalid local alias response'}
          } finally {
            if(!$agent.HasExited){Stop-Process -Id $agent.Id -Force -ErrorAction SilentlyContinue}
          }
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MICS-Only-Portable-Windows
          path: dist/MICS-Only-Portable-Windows.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.37
          name: MICS Only v0.2.37
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/MICS-Only-Portable-Windows.zip

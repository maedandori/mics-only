[package]
name = "mics-only"
version = "0.2.4"
edition = "2021"

[dependencies]
rsfbclient = { version = "=0.29.0", default-features = false, features = ["pure_rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
url = "2"

[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1.0", features = ["message-window", "menu", "cursor"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "mics-only-settings"
path = "src/bin/mics-only-settings.rs"
